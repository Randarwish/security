name: Python static checks
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile project source
        run: python -m compileall -q satelliteshield adversarialsoc threatgraph promptshield
      - name: Test benchmark and credit threshold logic without API calls
        run: python -m unittest promptshield.test_promptshield -v
